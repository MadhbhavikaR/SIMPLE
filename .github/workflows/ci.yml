name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install linters
        run: |
          pip install ruff
          sudo apt-get update
          sudo apt-get install -y shellcheck
      - name: Lint Python
        run: |
          ruff check src/
      - name: Lint Shell
        run: |
          shellcheck scripts/*.sh
