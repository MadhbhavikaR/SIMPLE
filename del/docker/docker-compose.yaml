networks:
  edge:
    driver: bridge
    internal: false
  app:
    driver: bridge
    internal: true
  db:
    driver: bridge
    internal: true
services:
  x-lsio-defaults:
    security_opt:
    - no-new-privileges:true
    tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
    - /run:rw,exec,nosuid,nodev,size=32m
    restart: unless-stopped
    secrets:
    - source: AUTHELIA_JWT_SECRET
      target: AUTHELIA_JWT_SECRET
    - source: AUTHELIA_SESSION_SECRET
      target: AUTHELIA_SESSION_SECRET
    - source: AUTHELIA_STORAGE_PASSWORD
      target: AUTHELIA_STORAGE_PASSWORD
    networks:
    - APPLICATIONS
  x-vault-app-defaults:
    user: ${U_ID}:${G_ID}
    read_only: true
    cap_drop: &id001
    - ALL
    security_opt: &id002
    - no-new-privileges:true
    tmpfs: &id003
    - /tmp:rw,noexec,nosuid,size=64m
    restart: unless-stopped
    authelia: &id004
      user: ${U_ID}:${G_ID}
      read_only: true
      cap_drop: *id001
      security_opt: *id002
      tmpfs: *id003
      restart: unless-stopped
      authelia: *id004
      image: authelia/authelia:latest
      container_name: authelia
      hostname: authelia
      networks:
      - app
      environment:
      - TZ=${TZ}
      - AUTHELIA_JWT_SECRET_FILE=/run/secrets/AUTHELIA_JWT_SECRET
      - AUTHELIA_SESSION_SECRET_FILE=/run/secrets/AUTHELIA_SESSION_SECRET
      - AUTHELIA_STORAGE_PASSWORD_FILE=/run/secrets/AUTHELIA_STORAGE_PASSWORD
      - AUTHELIA_STORAGE_LOCAL_PATH=/config/db.sqlite3
      - AUTHELIA_NOTIFICATIONS_DISABLE_REQUIRE_STARTUP_CHECK=true
      volumes:
      - ${VOLUMES_DIR}/authelia:/config:rw
      command:
      - --config
      - /config/configuration.yml
      - --storage.local.path
      - /config/db.sqlite3
    secrets:
    - source: AUTHELIA_JWT_SECRET
      target: AUTHELIA_JWT_SECRET
    - source: AUTHELIA_SESSION_SECRET
      target: AUTHELIA_SESSION_SECRET
    - source: AUTHELIA_STORAGE_PASSWORD
      target: AUTHELIA_STORAGE_PASSWORD
    networks:
    - APPLICATIONS
x-vault-app-defaults:
  user: ${U_ID}:${G_ID}
  read_only: true
  cap_drop:
  - ALL
  security_opt:
  - no-new-privileges:true
  tmpfs:
  - /tmp:rw,noexec,nosuid,size=64m
  restart: unless-stopped
secrets:
  AUTHELIA_JWT_SECRET:
    file: secrets/AUTHELIA_JWT_SECRET
  AUTHELIA_SESSION_SECRET:
    file: secrets/AUTHELIA_SESSION_SECRET
  AUTHELIA_STORAGE_PASSWORD:
    file: secrets/AUTHELIA_STORAGE_PASSWORD
