[project]
name = "simple"
version = "0.0.1"
description = "Self-hosted Infrastructure Made Painless"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cryptography>=46.0.3",
    "jinja2>=3.1.6",
    "pyyaml>=6.0.3",
    "questionary>=2.1.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "mypy>=1.11.2",
    "pydantic>=2.9.2",
    "types-pyyaml>=6.0.12",
]

[tool.mypy]
python_version = "3.13"
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["*/__init__.py"]

[tool.coverage.report]
show_missing = true
fail_under = 100  # Statement coverage
precision = 2

[tool.pytest.ini_options]
addopts = """
    --cov=src
    --cov-report=term-missing
    --cov-fail-under=100
    --cov-branch
    --cov-report=html:htmlcov
    --tb=short
    --durations=10
    -v
"""
