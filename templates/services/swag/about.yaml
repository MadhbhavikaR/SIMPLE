name: SWAG
description: "Nginx reverse proxy + Let's Encrypt SSL automation"
url: "https://github.com/linuxserver/docker-swag"
version: "6.7.0"
category:
  enum: "proxy"
enforced: true
docker_image: "linuxserver/swag:6.7.0"
dependencies: ["cloudflared"]
ports:
  http: 80
  https: 443
networks:
  enum:
    - APPLICATIONS
alternatives:
  - name: default
    description: "Standard SWAG configuration with Nginx and Let's Encrypt"
prompts:
  - name: DOMAIN
    description: "Root domain for Let's Encrypt certificates"
    type:
      enum: ["DOMAIN"]
    required: true
  - name: SUBDOMAINS
    description: "Comma-separated list of subdomains"
    type:
      enum: ["STRING"]
    required: true
  - name: EMAIL
    description: "Email address for Let's Encrypt notifications"
    type:
      enum: ["EMAIL"]
    required: true
  - name: SWAG_STAGING
    description: "Use Let's Encrypt staging environment (true/false)"
    type:
      enum: ["STRING"]
    required: true
    default: "false"
