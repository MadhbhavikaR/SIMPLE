docker:
  name: "Docker Container Engine"
  locations:
    binaries: ["/usr/bin/docker", "/usr/local/bin/docker"]
    config: ["/etc/docker/daemon.json"]
    service: ["/lib/systemd/system/docker.service", "/etc/systemd/system/docker.service"]
  check_cmd: "docker --version"
  os_overrides:
    ubuntu:
      locations:
        binaries: ["/usr/bin/docker"]
        config: ["/etc/docker/daemon.json"]
        service: ["/lib/systemd/system/docker.service"]
      install_cmd: "apt install"
      keyword: "docker.io"
    debian:
      locations:
        binaries: ["/usr/bin/docker"]
        config: ["/etc/docker/daemon.json"]
      install_cmd: "apt install"
      keyword: "docker.io"
    manjaro:
      locations:
        binaries: ["/usr/bin/docker"]
        config: ["/etc/docker/daemon.json"]
        service: ["/usr/lib/systemd/system/docker.service"]
      install_cmd: "pacman -S"
      keyword: "docker"

ufw:
  name: "UFW (Uncomplicated Firewall)"
  locations:
    binaries: ["/usr/sbin/ufw", "/sbin/ufw", "/usr/bin/ufw"]
    config: ["/etc/ufw/ufw.conf", "/etc/default/ufw"]
    service: ["/lib/systemd/system/ufw.service", "/etc/init.d/ufw"]
  check_cmd: "ufw version"
  os_overrides:
    ubuntu:
      locations:
        binaries: ["/usr/sbin/ufw"]
        config: ["/etc/ufw/ufw.conf"]
      install_cmd: "apt install"
      keyword: "ufw"
    debian:
      locations:
        binaries: ["/usr/sbin/ufw"]
        config: ["/etc/ufw/ufw.conf"]
      install_cmd: "apt install"
      keyword: "ufw"
    raspbian:
      locations:
        binaries: ["/usr/sbin/ufw"]
      install_cmd: "apt install"
      keyword: "ufw"
    manjaro:
      locations:
        binaries: ["/usr/bin/ufw"]
      install_cmd: "pacman -S"
      keyword: "ufw"

fail2ban:
  name: "Fail2Ban"
  locations:
    binaries: ["/usr/bin/fail2ban-client", "/usr/sbin/fail2ban-server", "/usr/bin/fail2ban-server"]
    config: ["/etc/fail2ban/jail.conf", "/etc/fail2ban/jail.d", "/etc/fail2ban/jail.local"]
    service: ["/lib/systemd/system/fail2ban.service"]
  check_cmd: "fail2ban-client --version"
  os_overrides:
    debian:
      locations:
        binaries: ["/usr/bin/fail2ban-client"]
      install_cmd: "apt install"
      keyword: "fail2ban"
    manjaro:
      locations:
        binaries: ["/usr/bin/fail2ban-client"]
      install_cmd: "pacman -S"
      keyword: "fail2ban"

apparmor:
  name: "AppArmor"
  locations:
    binaries: ["/sbin/apparmor_parser", "/usr/sbin/aa-status", "/usr/sbin/aa-enforce"]
    config: ["/etc/apparmor.d", "/etc/apparmor"]
    service: ["/lib/systemd/system/apparmor.service"]
  check_cmd: "aa-status"
  os_overrides:
    ubuntu:
      locations:
        binaries: ["/sbin/apparmor_parser"]
        config: ["/etc/apparmor.d"]
      install_cmd: "apt install"
      keyword: "apparmor"
    raspbian:
      locations:
        binaries: ["/sbin/apparmor_parser"]
      install_cmd: "apt install"
      keyword: "apparmor"
    manjaro:
      locations:
        binaries: ["/usr/bin/apparmor_parser"]
      install_cmd: "pacman -S"
      keyword: "apparmor"
