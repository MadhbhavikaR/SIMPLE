# Logging Configuration
# Defines logging settings for the application

version: 1
disable_existing_loggers: false
formatters:
  standard:
    format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
  detailed:
    format: '%(asctime)s - %(name)s - %(levelname)s - %(filename)s:%(lineno)d - %(message)s'
handlers:
  console:
    class: logging.StreamHandler
    level: DEBUG
    formatter: standard
    stream: ext://sys.stdout
  file:
    class: logging.FileHandler
    level: INFO
    formatter: detailed
    filename: 'simple.log'
    encoding: utf8
loggers:
  simple:
    level: DEBUG
    handlers: [console, file]
    propagate: false
  simple.engine:
    level: INFO
    handlers: [console, file]
    propagate: false
  simple.services:
    level: INFO
    handlers: [console, file]
    propagate: false
  simple.config:
    level: WARNING
    handlers: [console, file]
    propagate: false
